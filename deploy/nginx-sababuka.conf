server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/sababuka/current;
    index index.html;

    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # `upgrade-insecure-requests` is added only after origin HTTPS is active.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://satudata.kapuaskab.go.id; connect-src 'self' https://webapi.bps.go.id https://satudata.kapuaskab.go.id; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|json|geojson|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        expires 1h;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }
}
